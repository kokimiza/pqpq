[package]
name = "pqpq-server"
version = "0.1.0"
edition = "2024"

[dependencies]
pqpq-protocol = { path = "../pqpq-protocol" }
pqpq-sim = { path = "../pqpq-sim" }
quiche = "0.30.0"
boring = "5.2"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "time", "sync", "io-util", "signal", "fs"] }
tokio-rustls = { version = "0.26", default-features = false, features = ["ring", "tls12"] }
wtransport = "0.7"
