[package]
name = "pqpq"
version = "0.1.0"
edition = "2024"

[dependencies]
# 非同期ランタイム
tokio = { version = "1.42", features = ["full"] }

# TUI
ratatui = "0.30.0"
crossterm = "0.29.0"

# CLI
clap = { version = "4.5", features = ["derive"] }

# WebRTC
webrtc = "0.17.1"

# データベース
sqlx = { version = "0.8", features = ["runtime-tokio-rustls", "postgres", "uuid", "chrono", "macros"] }

# 暗号
ed25519-dalek = { version = "2", features = ["rand_core"] }
rand = "0.10.0"
hex = "0.4"

# バイト操作（webrtc DataChannel送受信用）
bytes = "1"

# エラーハンドリング
anyhow = "1.0"
thiserror = "2.0"

# シリアライゼーション
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

# UUID
uuid = { version = "1.22.0", features = ["v4", "serde"] }

# 日時
chrono = { version = "0.4", features = ["serde"] }

# 環境変数
dotenvy = "0.15"

# 非同期trait
async-trait = "0.1"

[dev-dependencies]
mockall = "0.14.0"

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
strip = true
